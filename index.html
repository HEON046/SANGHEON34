9px;transition:width .35s ease}\n\n  /* 상세 입력 창 */\n  dialog#dlg{margin:auto;border:none;border-radius:18px;padding:0;width:min(880px,calc(100% - 32px));max-height:calc(100vh - 48px);\n    box-shadow:0 24px 60px rgba(15,42,74,.28);color:var(--ink);font-family:inherit}\n  dialog#dlg::backdrop{background:rgba(15,23,42,.45)}\n  .dlg-wrap{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}\n  .dlg-head{padding:22px 64px 16px 26px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 20px}\n  .dlg-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n  .dlg-title .idx{font-size:13px;font-weight:800;color:var(--muted)}\n  .dlg-title h3{font-size:20px;font-weight:800}\n  .dlg-score{grid-row:1/4;grid-column:2;text-align:right;min-width:150px}\n  .dlg-score .pct{font-size:44px;font-weight:800;color:var(--navy);line-height:1}\n  .dlg-score .pct small{font-size:18px;color:var(--muted)}\n  .dlg-score .vs{font-size:12.5px;color:var(--muted);margin:4px 0 8px}\n  .dlg-score .vs b{color:var(--ink)}\n  .dlg-basis{font-size:12.5px;color:var(--muted)}\n  .dlg-reason{font-size:12px;color:var(--ink-2);background:var(--bg-2);border-radius:8px;padding:5px 10px;justify-self:start}\n  .dlg-x{position:absolute;top:14px;right:14px;border:none;background:var(--bg-2);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink-2)}\n  .dlg-x:hover{background:#e2e8f0}\n  .dlg-hint{font-size:12.5px;font-weight:700;color:var(--blue);padding:14px 26px 0}\n  .dlg-body{padding:12px 26px 18px;overflow-y:auto}\n  .dlg-foot{padding:14px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg-2)}\n  .dlg-foot span{font-size:13px;font-weight:700;color:var(--ink-2)}\n  .btn{font:inherit;font-size:13.5px;font-weight:700;border-radius:10px;padding:9px 18px;cursor:pointer;border:none;background:var(--blue);color:#fff}\n  .btn:hover{background:#1d4ed8}\n  .e olumns:1fr 1.25fr;gap:20px}\n  .s3{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}\n  .card{border:1px solid var(--line);border-radius:16px;padding:20px 22px 16px;background:#fff;margin:0}\n  .card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}\n  .card h3{font-size:16px;font-weight:800}\n  .legend{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}\n  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:8px}\n  .sw.mine{background:rgba(37,99,235,.25);border:2px solid var(--blue)}\n  .sw.goal{border:2px dashed #94a3b8;background:transparent}\n  .sw.tag-m,.sw.req{background:var(--blue)}\n  .sw.tag-p{background:#94a3b8}\n  .sw.pref{background:#f59e0b}\n  .s1>*,.s2>*,.s3>*{min-width:0}\n  .chart-box{position:relative;width:100%;min-width:0;overflow:hidden}\n  .chart-box.radar{height:340px}\n  .chart-box.bars{height:340px}\n  .chart-box.market{height:520px}\n  figcaption{font-size:12px;color:var(--muted);margin-top:10px;border-top:1px solid var(--line);padding-top:8px}\n  .facts h3{margin-bottom:12px}\n  .fact{padding:12px 0;border-top:1px solid var(--line)}\n  .fact:first-of-type{border-top:none;padding-top:0}\n  .fact .k{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center}\n  .fact .v{font-size:26px;font-weight:800;color:var(--navy);line-height:1.2;margin-top:4px}\n  .fact .v small{font-size:13px;color:var(--muted);font-weight:700;margin-left:2px}\n  .fact .d{font-size:12px;color:var(--muted);margin-top:4px}\n  @media (max-width:1000px){ .s2,.s3{grid-template-columns:1fr} }\n\n  /* ④ 공고 원본 표 */\n  .tbl-card{padding:0;overflow:hidden}\n  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--bg-2)}\n  .filters label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink-2)}\n  .filters input,.filters select{font:inherit;font-size:13.5px;font-weight:500;border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink)}\n  .filters input:focus,.filters select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}\n  .f-search{flex:1 1 240px}\n  .f-search input{width:100%}\n  .f-count{margin-left:auto;font-size:13px;color:var(--muted);padding-bottom:8px}\n  .f-count b{color:var(--navy);font-size:18px;font-weight:800}\n  .tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}\n  .tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}\n  .tbl th:hover{color:var(--ink)}\n  .tbl th.sorted{color:var(--blue)}\n  .tbl th .arr{font-size:10px;margin-left:3px}\n  .tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}\n  .tbl tr:last-child td{border-bottom:none}\n  .tbl tbody tr:hover td{background:#fafcff}\n  .tbl .c-no{width:48px;white-space:nowrap}\n  .tbl th:nth-child(2){width:22%} .tbl th:nth-child(3){width:86px} .tbl th:nth-child(4){width:80px}\n  .tbl th:nth-child(5){width:72px} .tbl th:nth-child(8){width:80px} .tbl th:nth-child(9){width:108px}\n  .tbl .co{font-weight:800;color:var(--ink)}\n  .tbl .ti{color:var(--ink-2);margin-top:2px;line-height:1.45}\n  .tbl .note{font-size:11.5px;color:var(--muted);margin-top:4px}\n  .chips{display:flex;flex-wrap:wrap;gap:4px}\n  .chip{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--blue-soft);color:#1d4ed8;font-weight:600}\n  .chip.p{background:#fef3c7;color:#92400e}\n  .chip.c{background:#f1f5f9;color:#475569}\n  .none{color:#cbd5e1}\n  .yes{font-weight:800;color:var(--blue)}\n  .tbl a{color:var(--blue);font-weight:700;text-decoration:none}\n  .tbl a:hover{text-decoration:underline}\n  .tbl .date{font-size:11.5px;color:var(--muted);margin-top:2px}\n  .tbl-empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}\n  @media (max-width:900px){\n    .tbl thead{display:none}\n    .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}\n    .tbl tr{padding:14px 18px;border-bottom:1px solid var(--line)}\n    .tbl td{border:none;padding:4px 0}\n    .tbl td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}\n    .tbl td.c-no{display:none}\n    .f-count{margin-left:0}\n  }\n\n  /* 푸터 */\n  .site-foot{background:var(--navy);color:#cbd5e1;margin-top:64px;padding:48px 0 40px}\n  .site-foot h2{color:#fff;font-size:20px;font-weight:800;margin-bottom:20px}\n  .foot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 28px}\n  .foot-grid h4{color:#93c5fd;font-size:12.5px;font-weight:800;margin-bottom:6px}\n  .foot-grid p{font-size:13px;line-height:1.65}\n  .foot-meta{margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#94a3b8}\n  @media (max-width:900px){ .foot-grid{grid-template-columns:1fr} }\n\n  /* 개요형 글 + 추가 시각 요소 */\n  .points{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 22px;color:var(--muted);font-size:14px}\n  .points li::before{content:\"\";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--blue);margin:0 8px 2px 0;vertical-align:middle}\n  .mchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;grid-column:1/2}\n  .mchips .chip{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--blue-soft);color:#1d4ed8;font-weight:600}\n  .mchips .chip b{font-weight:800;margin-left:2px}\n  .mini{margin-top:8px}\n  .mini-bar{height:6px;background:#eef2f7;border-radius:99px;overflow:hidden}\n  .mini-bar i{display:block;height:100%;background:var(--blue);border-radius:99px}\n  .mini span{display:block;font-size:12px;color:var(--muted);margin-top:4px}\n  .mix-card{margin-top:20px}\n  .mix-row{display:grid;grid-template-columns:120px 1fr 280px;gap:14px;align-items:center;padding:8px 0}\n  .mix-name{font-size:13px;font-weight:700}\n  .mix-bar{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;background:#fff}\n  .mix-bar span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;min-width:18px}\n  .mix-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}\n  .mix-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}\n  .foot-grid ul{list-style:none;font-size:13px;line-height:1.75}\n  .foot-grid li::before{content:\"·\";margin-right:6px;color:#93c5fd}\n  @media (max-width:900px){ .mix-row{grid-template-columns:1fr} }\n\n  .placeholder{border:1.5px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted);font-size:14px}\n\n  @media (max-width:1000px){\n    .toc{display:none} main{margin-left:0}\n    .kpi-grid{grid-template-columns:1fr 1fr}\n    .kpi.main{grid-column:1/-1}\n    .s1{grid-template-columns:1fr}\n    .total{position:static}\n  }\n  @media (max-width:640px){\n    .wrap{padding:0 18px}\n    .cover h1{font-size:28px}\n    .metrics{grid-template-columns:1fr}\n  }\n<\/style>\n<\/head>\n<body>\n\n<nav class=\"toc\" aria-label=\"목차\">\n  <div class=\"brand\"><small>QUANT · GAME QA<\/small>취업 준비를 위한<br>정량 사이트<\/div>\n  <a href=\"#cover\" data-sec=\"cover\"><span class=\"n\">00<\/span>표지·핵심 수치<\/a>\n  <a href=\"#s1\" data-sec=\"s1\"><span class=\"n\">01<\/span>내 지표 입력<\/a>\n  <a href=\"#s2\" data-sec=\"s2\"><span class=\"n\">02<\/span>충족률 비교<\/a>\n  <a href=\"#s3\" data-sec=\"s3\"><span class=\"n\">03<\/span>시장 데이터<\/a>\n  <a href=\"#s4\" data-sec=\"s4\"><span class=\"n\">04<\/span>공고 원본 표<\/a>\n  <div class=\"foot\">게임잡 QA 공고 15건 기준<br>입력값은 브라우저에만 저장<\/div>\n<\/nav>\n\n<main>\n  <\!-- 표지 -->\n  <header class=\"cover\" id=\"cover\">\n    <div class=\"wrap\">\n      <div class=\"eyebrow\">게임 QA 신입 기준<\/div>\n      <h1>취업 준비를 위한 정량 사이트<\/h1>\n      <p class=\"summary\">공고 15건 기준, 시장 요구와 내 역량 비교<br>지표 6개 충족률로 한눈에<\/p>\n      <div class=\"who\"><span id=\"cover-name\">김상헌<\/span><span>지원 직무 · 게임 QA (신입)<\/span><\/div>\n    <\/div>\n  <\/header>\n\n  <\!-- 핵심 수치 띠 -->\n  <div class=\"kpi-band\">\n    <div class=\"wrap\">\n      <div class=\"kpi-grid\">\n        <div class=\"kpi main\">\n          <div class=\"label\">종합 충족률<\/div>\n          <div class=\"value num\" id=\"kpi-total\">–<\/div>\n          <div class=\"sub\" id=\"kpi-total-sub\">지표 6개 단순 평균<\/div>\n        <\/div>\n        <div class=\"kpi\">\n          <div class=\"label\">분석 공고 수<\/div>\n          <div class=\"value num\" id=\"kpi-sample\">–<\/div>\n          <div class=\"sub\">게임 QA 신입·경력무관<\/div>\n        <\/div>\n        <div class=\"kpi\">\n          <div class=\"label\">100% 충족 지표<\/div>\n          <div class=\"value num\" id=\"kpi-full\">–<\/div>\n          <div class=\"sub\">계산된 지표 중<\/div>\n        <\/div>\n        <div class=\"kpi\">\n          <div class=\"label\">가장 부족한 지표<\/div>\n          <div class=\"value num\" id=\"kpi-low\" style=\"font-size:22px;line-height:1.5\">–<\/div>\n          <div class=\"sub\" id=\"kpi-low-sub\">&nbsp;<\/div>\n        <\/div>\n        <div class=\"kpi\">\n          <div class=\"label\">AI·자동화 언급 공고<\/div>\n          <div class=\"value num\" id=\"kpi-ai\">–<\/div>\n          <div class=\"sub\" id=\"kpi-ai-sub\">시장 참고치<\/div>\n        <\/div>\n      <\/div>\n      <p class=\"band-note\" id=\"band-note\"><\/p>\n    <\/div>\n  <\/div>\n\n  <\!-- ① 내 지표 입력 -->\n  <section class=\"sec\" id=\"s1\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\"><span class=\"no\">01<\/span><h2>내 지표 입력<\/h2><\/div>\n      <ul class=\"points\"><li>카드를 누르면 상세 입력 창<\/li><li>항목별 입력 → 자동 합산<\/li><li>충족률 = 내 값 ÷ 목표값 (최대 100%)<\/li><\/ul>\n      <div class=\"s1\">\n        <div class=\"metrics\" id=\"metrics\"><\/div>\n        <aside class=\"total\">\n          <div class=\"label\">종합 충족률<\/div>\n          <div class=\"big num\" id=\"total-big\">–<\/div>\n          <div class=\"bar\"><i id=\"total-bar\" style=\"width:0%\"><\/i><\/div>\n          <p class=\"formula\" id=\"total-formula\"><\/p>\n          <ul id=\"total-list\"><\/ul>\n          <div class=\"actions\"><button type=\"button\" id=\"reset\">입력값 초기화<\/button><\/div>\n        <\/aside>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <\!-- 이후 단계 자리 -->\n  <section class=\"sec\" id=\"s2\"><div class=\"wrap\">\n    <div class=\"sec-head\"><span class=\"no\">02<\/span><h2>충족률 비교<\/h2><\/div>\n    <ul class=\"points\"><li>① 입력값 실시간 반영<\/li><li>점선 = 목표 100% · 파란 면 = 내 충족률<\/li><\/ul>\n    <div class=\"s2\">\n      <figure class=\"card\">\n        <div class=\"card-head\"><h3>지표 6개 충족률<\/h3><span class=\"legend\"><i class=\"sw mine\"><\/i>내 충족률 <i class=\"sw goal\"><\/i>목표 100%<\/span><\/div>\n        <div class=\"chart-box radar\"><canvas id=\"radar\" aria-label=\"지표 6개 충족률 레이더 차트\" role=\"img\"><\/canvas><\/div>\n        <figcaption>도표 1. 지표별 충족률 (내 값 ÷ 목표값, 최대 100%)<\/figcaption>\n      <\/figure>\n      <figure class=\"card\">\n        <div class=\"card-head\"><h3>지표별 내 값과 목표<\/h3><span class=\"legend\"><i class=\"sw tag-m\"><\/i>시장 기준 <i class=\"sw tag-p\"><\/i>개인 설정<\/span><\/div>\n        <div class=\"chart-box bars\"><canvas id=\"bars\" aria-label=\"지표별 충족률 막대 차트\" role=\"img\"><\/canvas><\/div>\n        <figcaption>도표 2. 막대는 충족률, 숫자는 내 값/목표<\/figcaption>\n      <\/figure>\n    <\/div>\n  <\/div><\/section>\n  <section class=\"sec\" id=\"s3\"><div class=\"wrap\">\n    <div class=\"sec-head\"><span class=\"no\">03<\/span><h2>시장 데이터<\/h2><\/div>\n    <ul class=\"points\" id=\"s3-desc\"><\/ul>\n    <div class=\"s3\">\n      <figure class=\"card\">\n        <div class=\"card-head\"><h3>공고 요구·우대 항목 TOP 10<\/h3><span class=\"legend\"><i class=\"sw req\"><\/i>필수(자격요건) <i class=\"sw pref\"><\/i>우대사항<\/span><\/div>\n        <div class=\"chart-box market\"><canvas id=\"market\" aria-label=\"공고 요구·우대 항목 빈도 막대 차트\" role=\"img\"><\/canvas><\/div>\n        <figcaption id=\"market-cap\"><\/figcaption>\n      <\/figure>\n      <aside class=\"card facts\">\n        <h3>시장 기준 목표값은 이렇게 정했습니다<\/h3>\n        <div id=\"facts\"><\/div>\n      <\/aside>\n    <\/div>\n    <figure class=\"card mix-card\">\n      <div class=\"card-head\"><h3>공고 15건 구성<\/h3><\/div>\n      <div id=\"mix\"><\/div>\n      <figcaption>도표 4. 조건별 공고 비율 (막대 안 숫자 = 건수)<\/figcaption>\n    <\/figure>\n  <\/div><\/section>\n  <section class=\"sec\" id=\"s4\"><div class=\"wrap\">\n    <div class=\"sec-head\"><span class=\"no\">04<\/span><h2>공고 원본 표<\/h2><\/div>\n    <ul class=\"points\"><li>③ 집계에 쓴 공고 15건 원본<\/li><li>열 제목 클릭 = 정렬 · 필터로 좁히기<\/li><li>마감된 공고도 표에 유지<\/li><\/ul>\n    <div class=\"card tbl-card\">\n      <div class=\"filters\">\n        <label class=\"f-search\"><span>검색<\/span><input id=\"f-q\" type=\"search\" placeholder=\"회사, 공고 제목, 항목 (예: Jira)\"><\/label>\n        <label><span>경력 조건<\/span><select id=\"f-career\"><option value=\"\">전체<\/option><option>신입<\/option><option>경력무관<\/option><\/select><\/label>\n        <label><span>고용 형태<\/span><select id=\"f-employ\"><option value=\"\">전체<\/option><\/select><\/label>\n        <label><span>AI·자동화 언급<\/span><select id=\"f-ai\"><option value=\"\">전체<\/option><option value=\"1\">있음<\/option><option value=\"0\">없음<\/option><\/select><\/label>\n        <div class=\"f-count\" id=\"f-count\"><\/div>\n      <\/div>\n      <table class=\"tbl\" id=\"tbl\">\n        <thead><tr>\n          <th data-k=\"no\" class=\"c-no\">#<\/th>\n          <th data-k=\"company\">회사 · 공고<\/th>\n          <th data-k=\"career\">경력 조건<\/th>\n          <th data-k=\"employ\">고용 형태<\/th>\n          <th data-k=\"edu\">학력<\/th>\n          <th data-k=\"nreq\">필수 항목<\/th>\n          <th data-k=\"npref\">우대 항목<\/th>\n          <th data-k=\"ai\">AI·자동화<\/th>\n          <th data-k=\"collectedAt\">출처 · 수집일<\/th>\n        <\/tr><\/thead>\n        <tbody><\/tbody>\n      <\/table>\n      <p class=\"tbl-empty\" id=\"tbl-empty\" hidden>조건에 맞는 공고가 없습니다.<\/p>\n    <\/div>\n  <\/div><\/section>\n\n  <footer class=\"site-foot\"><div class=\"wrap\">\n    <h2>데이터 기준과 한계<\/h2>\n    <div class=\"foot-grid\">\n      <div><h4>표본<\/h4><ul><li id=\"ft-sample1\"><\/li><li>게임잡 · 2026-11-19 수집<\/li><li>공고 1건 ≈ 6.7%p → 경향으로 읽기<\/li><\/ul><\/div>\n      <div><h4>선정 방식<\/h4><ul><li>QA·테스터 목록 기본 정렬 순<\/li><li>신입·경력무관 QA 공고만<\/li><li>제외: 경력 N년↑, 비QA 4건<\/li><li>게임잡에 인기순 정렬 없음<\/li><\/ul><\/div>\n      <div><h4>집계 방식<\/h4><ul><li>자격요건 = 필수, 우대사항 = 우대<\/li><li>공고당 같은 항목 1회만<\/li><li>비슷한 표현은 하나로 통합<\/li><li>이미지 공고 7건 직접 판독<\/li><\/ul><\/div>\n      <div><h4>한계<\/h4><ul><li id=\"ft-limit1\"><\/li><li>경력 목표 근거 1건뿐<\/li><li>항목 분류에 작성자 판단 포함<\/li><\/ul><\/div>\n      <div><h4>개인 설정 목표값<\/h4><ul><li>산출물 100건 · 플레이 12게임<\/li><li>AI 사례 5건 · 영역 4개<\/li><li>공고에 숫자 근거 없음<\/li><\/ul><\/div>\n      <div><h4>내 값<\/h4><ul><li>증명 가능한 수치만 입력<\/li><li>이 브라우저에만 저장<\/li><\/ul><\/div>\n    <\/div>\n    <p class=\"foot-meta\">취업 준비를 위한 정량 사이트 · 김상헌 · 게임 QA(신입)<\/p>\n  <\/div><\/footer>\n<\/main>\n\n<dialog id=\"dlg\" aria-labelledby=\"dlg-name\">\n  <div class=\"dlg-wrap\">\n    <button type=\"button\" class=\"dlg-x\" id=\"dlg-close\" aria-label=\"닫기\">×<\/button>\n    <div class=\"dlg-head\">\n      <div class=\"dlg-title\"><span class=\"idx\" id=\"dlg-idx\"><\/span><h3 id=\"dlg-name\"><\/h3><span class=\"tag\" id=\"dlg-tag\"><\/span><\/div>\n      <div class=\"dlg-score\"><div class=\"pct num\" id=\"dlg-pct\"><\/div><div class=\"vs\" id=\"dlg-vs\"><\/div><div class=\"bar\"><i id=\"dlg-bar\"><\/i><\/div><\/div>\n      <div class=\"dlg-basis\" id=\"dlg-basis\"><\/div>\n      <div class=\"mchips\" id=\"dlg-chips\"><\/div>\n      <div class=\"dlg-reason\" id=\"dlg-reason\"><\/div>\n    <\/div>\n    <div class=\"dlg-hint\" id=\"dlg-hint\"><\/div>\n    <div class=\"dlg-body\" id=\"dlg-body\"><\/div>\n    <div class=\"dlg-foot\"><span id=\"dlg-sub\"><\/span><button type=\"button\" class=\"btn\" id=\"dlg-done\">완료<\/button><\/div \"경력무관\", employ:\"계약직\", edu:\"학력무관\", careerMonths:12, careerNote:\"우대: QA 경력 1년 이상\",\n    req:[\"다양한 게임 플레이 경험\"], pref:[\"게임·QA 실무 경험\",\"Jira\",\"Confluence\",\"Redmine\",\"Asana\",\"영어·외국어\"], cond:[], ai:false },\n  { company:\"위메이드\", title:\"게임 QA (계약직)\", gi:285604, career:\"경력무관\", employ:\"계약직\", edu:\"학력무관\", careerMonths:0,\n    req:[\"다양한 게임 플레이 경험\",\"TC 작성\",\"문서 작성·리포트\"], pref:[\"게임·QA 실무 경험\",\"Jira\",\"Redmine\",\"관련 학과 전공\"], cond:[], ai:false },\n  { company:\"스마일게이트\", title:\"[CROSSFIRE] Test Engineer (계약직)\", gi:286541, career:\"신입\", employ:\"계약직\", edu:\"학력무관\", careerMonths:0,\n    req:[\"엑셀·스프레드시트\",\"다양한 게임 플레이 경험\"], pref:[\"QA 자격증(ISTQB 등)\",\"게임·QA 실무 경험\"], cond:[], ai:false },\n  { company:\"스마일게이트\", title:\"[샌드박스] Test Engineer (계약직)\", gi:286291, career:\"신입\", employ:\"계약직\", edu:\"학력무관\", careerMonths:0,\n    req:[\"엑셀·스프레드시트\"], pref:[\"QA 자격증(ISTQB 등)\",\"관련 학과 전공\",\"BTS 사용\",\"MOD 개발\",\"다양한 게임 플레이 경험\"], cond:[], ai:false },\n  { company:\"컴투스\", title:\"런처(PC 클라이언트) QA (계약직)\", gi:285587, career:\"경력무관\", employ:\"계약직\", edu:\"학력무관\", careerMonths:0,\n    req:[\"문서 작성·리포트\"], pref:[\"게임·QA 실무 경험\",\"QA 자격증(ISTQB 등)\",\"Jira\",\"Confluence\"], cond:[\"해외 출장·여행 결격 없음\"], ai:false },\n  { company:\"컴투스\", title:\"[서머너즈워] QA 담당자 (계약직)\", gi:285146, career:\"경력무관\", employ:\"계약직\", edu:\"학력무관\", careerMonths:0,\n    req:[\"다양한 게임 플레이 경험\",\"문서 작성·리포트\"], pref:[\"관련 학과 전공\",\"게임·QA 실무 경험\",\"테스트 툴 사용\",\"QA 자격증(ISTQB 등)\",\"영어·외국어\"], cond:[\"해외 출장·여행 결격 없음\"], ai:false },\n  { company:\"컴투스\", title:\"[컴투스프로야구 시리즈] QA 담당자 (계약직)\", gi:285143, career:\"경력무관\", employ:\"계약직\", edu:\"학력무관\", careerMonths:0,\n    req:[], pref:[\"게임·QA 실무 경험\",\"QA 자격증(ISTQB 등)\",\"테스트 툴 사용\",\"문서 작성·리포트\",\"다양한 게임 플레이 경험\"], cond:[\"해외 출장·여행 결격 없음\"], ai:false },\n  { company:\"리턴픽셀\", title:\"게임 기획/QA 인턴\", gi:286176, career:\"경력무관\", employ:\"인턴\", edu:\"초대졸↑\", careerMonths:0,\n    req:[\"엑셀·스프레드시트\"], pref:[], cond:[\"해외 출장·여행 결격 없음\",\"초대졸 이상\"], ai:false },\n  { company:\"코스모스게이밍코리아\", title:\"웹게임 QA 테스터\", gi:286402, career:\"경력무관\", employ:\"-\", edu:\"학력무관\", careerMonths:0,\n    req:[], pref:[\"게임·QA 실무 경험\",\"Jira\",\"엑셀·스프레드시트\",\"Notion\",\"영어·외국어\"], cond:[], ai:true },\n  { company:\"CCR\", title:\"[포트리스] QA 담당자\", gi:286879, career:\"경력무관\", employ:\"-\", edu:\"학력무관\", careerMonths:0,\n    req:[\"Unity\"], pref:[\"AI 도구·자동화\",\"TC 작성\",\"다양한 게임 플레이 경험\"], cond:[], ai:true }\n].map(p=>({...p, url:GJ(p.gi), collectedAt:COLLECTED_AT}));\n\n/* 집계 */\nconst TOOL_TAGS = [\"엑셀·스프레드시트\",\"Jira\",\"Unity\",\"Confluence\",\"Redmine\",\"Git\",\"Notion\",\"Asana\",\"BTS 사용\",\"영상 제작 툴\"];\nconst COND_TAGS = [\"QA 자격증(ISTQB 등)\",\"해외 출장·여행 결격 없음\",\"관련 학과 전공\",\"초대졸 이상\"];\nconst COND_MIN = 3; // 3건(20%) 이상 등장한 조건만 목표에 포함\n\nfunction tally(){\n  const m = new Map();\n  POSTINGS.forEach(p=>{\n    const required = new Set([...p.req, ...p.cond]);\n    const all = new Set([...p.req, ...p.cond, ...p.pref]);\n    all.forEach(t=>{\n      const o = m.get(t) || {tag:t, total:0, req:0, pref:0};\n      o.total++; required.has(t) ? o.req++ : o.pref++;\n      m.set(t,o);\n    });\n  });\n  return [...m.values()].sort((a,b)=> b.total-a.total || b.req-a.req);\n}\nconst TALLY = tally();\nconst countOf = t => (TALLY.find(x=>x.tag===t)||{total:0}).total;\nconst median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), h=Math.floor(s.length/2); return s.length%2 ? s[h] : (s[h-1]+s[h])/2; };\nconst careerStated = POSTINGS.filter(p=>p.careerMonths>0);\n\nconst MARKET = {\n  sampleSize: POSTINGS.length,\n  careerMedian: median(careerStated.map(p=>p.careerMonths)),   // (가) 경력 기간이 적힌 공고만으로 중앙값\n  careerStatedCount: careerStated.length,\n  topSkills: TOOL_TAGS.map(t=>({tag:t,n:countOf(t)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,5),\n  topConditions: COND_TAGS.map(t=>({tag:t,n:countOf(t)})).filter(x=>x.n>=COND_MIN).sort((a,b)=>b.n-a.n),\n  aiMentionCount: POSTINGS.filter(p=>p.ai).length\n};\nconst listTags = arr => arr.map(x=>`${x.tag} ${x.n}건`).join(\", \");\n\n/* 지표 6개 — 카드를 누르면 상세 입력 창이 열림 */\nconst GENRES = [\"RPG\",\"액션\",\"슈팅\",\"전략\",\"퍼즐\",\"캐주얼\",\"스포츠\",\"시뮬레이션\",\"카드\",\"기타\"];\nconst PLATFORMS = [\"모바일\",\"PC\",\"콘솔\",\"멀티\"];\nconst AI_AREAS = [\"TC 작성\",\"버그 리포트\",\"테스트 데이터\",\"자동화\"];\nconst LEVELS = [[0,\"없음\"],[25,\"학습 중\"],[50,\"기본 사용\"],[75,\"실무 사용\"],[100,\"능숙\"]];\nconst QSTAT = [[\"no\",\"미충족\"],[\"prep\",\"준비 중\"],[\"ok\",\"충족\"]];\nconst sumOf = (arr,k) => arr.reduce((a,r)=>a+(Number(r[k])||0),0);\nconst filled = arr => arr.filter(r=>String(r.name||\"\").trim());\n\nconst METRICS = [\n  { id:\"career\", name:\"QA 실무 경력\", basis:\"market\", kind:\"list\",\n    hint:\"참여한 QA 프로젝트를 한 줄씩 추가\",\n    fields:[{k:\"name\",l:\"프로젝트명\",t:\"text\",ph:\"예: 스토브 인디 게임 QA\",w:\"2fr\"},{k:\"role\",l:\"역할\",t:\"text\",ph:\"예: 기능 테스트\",w:\"1.3fr\"},\n            {k:\"months\",l:\"기간(개월)\",t:\"number\",w:\"90px\"},{k:\"link\",l:\"증빙 링크\",t:\"url\",ph:\"https://\",w:\"1.4fr\"}],\n    target:()=>MARKET.careerMedian,\n    basisText:()=> `경력 명시 공고 ${MARKET.careerStatedCount}/${MARKET.sampleSize}건의 중앙값`,\n    calc:s=>{ const r=filled(s.career), m=sumOf(r,\"months\"); const t=MARKET.careerMedian;\n      return { rate:clamp01(m/t), mine:`${m}개월`, goal:`${t}개월`, sub:`프로젝트 ${r.length}개 · 합계 ${m}개월` }; } },\n  { id:\"output\", name:\"QA 산출물\", basis:\"personal\", kind:\"list\",\n    hint:\"게임·프로젝트별로 작성한 TC와 버그 리포트 수\",\n    fields:[{k:\"name\",l:\"게임·프로젝트명\",t:\"text\",ph:\"예: 메이플 키우기\",w:\"2fr\"},{k:\"tc\",l:\"TC 수\",t:\"number\",w:\"90px\"},\n            {k:\"bug\",l:\"버그 리포트\",t:\"number\",w:\"100px\"},{k:\"link\",l:\"증빙 링크\",t:\"url\",ph:\"https://\",w:\"1.4fr\"}],\n    target:()=>100, reason:\"TC + 버그 리포트 합계 100건 기준선\", basisText:()=>\"목표 100건 (TC + 버그 리포트)\",\n    calc:s=>{ const r=filled(s.output), tc=sumOf(r,\"tc\"), bug=sumOf(r,\"bug\");\n      return { rate:clamp01((tc+bug)/100), mine:`${tc+bug}건`, goal:\"100건\", sub:`프로젝트 ${r.length}개 · TC ${tc} · 버그 ${bug}` }; } },\n  { id:\"skill\", name:\"툴·스킬\", basis:\"market\", kind:\"tools\",\n    hint:\"툴마다 숙련도 선택 · 상위 5개 평균으로 계산\",\n    target:()=>100, basisText:()=> `공고 빈출 툴 상위 ${MARKET.topSkills.length}개 · 평균 숙련도`, chips:()=>MARKET.topSkills,\n    calc:s=>{ const v=MARKET.topSkills.map(t=>Number(s.tools[t.tag])||0), avg=Math.round(v.reduce((a,b)=>a+b,0)/v.length);\n      const pro=v.filter(x=>x>=75).length, extra=filled(s.toolsExtra).length;\n      return { rate:clamp01(avg/100), mine:`평균 ${avg}%`, goal:\"100%\", sub:`실무 이상 ${pro}개${extra?` · 기타 툴 ${extra}개`:\"\"}` }; } },\n  { id:\"qual\", name:\"자격·학력\", basis:\"market\", kind:\"quals\",\n    hint:\"조건별 상태 선택 · '충족'만 계산\",\n    target:()=>MARKET.topConditions.length, basisText:()=> `공고 ${COND_MIN}건 이상 등장한 조건`, chips:()=>MARKET.topConditions,\n    calc:s=>{ const st=MARKET.topConditions.map(c=>(s.quals[c.tag]||{}).st||\"no\"); const ok=st.filter(x=>x===\"ok\").length, prep=st.filter(x=>x===\"prep\").length, t=st.length;\n      return { rate:clamp01(ok/t), mine:`${ok}항목`, goal:`${t}항목`, sub:`충족 ${ok} · 준비 중 ${prep}` }; } },\n  { id:\"play\", name:\"플레이 경험\", basis:\"personal\", kind:\"list\",\n    hint:\"플레이한 게임을 한 줄씩 추가\",\n    fields:[{k:\"name\",l:\"게임명\",t:\"text\",ph:\"예: 제우스: 오만의 신\",w:\"2fr\"},{k:\"genre\",l:\"장르\",t:\"select\",o:GENRES,w:\"110px\"},\n            {k:\"platform\",l:\"플랫폼\",t:\"select\",o:PLATFORMS,w:\"90px\"},{k:\"hours\",l:\"플레이(시간)\",t:\"number\",w:\"100px\"},{k:\"link\",l:\"증빙 링크\",t:\"url\",ph:\"https://\",w:\"1.2fr\"}],\n    target:()=>12, reason:\"앱스토어 인기 12개 게임 플레이 과제 기준\", basisText:()=>\"목표 12게임\",\n    calc:s=>{ const r=filled(s.play), h=sumOf(r,\"hours\"), g=new Set(r.map(x=>x.genre).filter(Boolean)).size;\n      return { rate:clamp01(r.length/12), mine:`${r.length}게임`, goal:\"12게임\", sub:`${r.length}게임 · ${h}시간 · 장르 ${g}개` }; } },\n  { id:\"ai\", name:\"AI 활용도\", basis:\"personal\", kind:\"list\",\n    hint:\"AI로 만든 QA 산출물을 한 줄씩 추가\",\n    fields:[{k:\"name\",l:\"활용 사례\",t:\"text\",ph:\"예: TC 초안 자동 생성\",w:\"2fr\"},{k:\"area\",l:\"QA 영역\",t:\"select\",o:[...AI_AREAS,\"기타\"],w:\"120px\"},\n            {k:\"tool\",l:\"사용 AI\",t:\"text\",ph:\"예: Claude\",w:\"1fr\"},{k:\"link\",l:\"증빙 링크\",t:\"url\",ph:\"https://\",w:\"1.2fr\"}],\n    target:()=>({cases:5,areas:4}), reason:\"영역 4개: TC·버그 리포트·테스트 데이터·자동화\", basisText:()=>\"목표 사례 5건 · 영역 4개 (평균)\",\n    calc:s=>{ const r=filled(s.ai), k=new Set(r.map(x=>x.area).filter(a=>AI_AREAS.includes(a))).size;\n      return { rate:(clamp01(r.length/5)+clamp01(k/4))/2, mine:`${r.length}건 · ${k}개`, goal:\"5건 · 4개\", sub:`사례 ${r.length}건 · 영역 ${k}/4` }; } }\n];\n\n/* ───────── 상태 ───────── */\nconst STORE_KEY = \"qa-quant-detail-v2\";\nconst DEFAULTS = () => ({ career:[], output:[], play:[], ai:[], tools:{}, toolsExtra:[], quals:{} });\nfunction load(){ try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)); return {...DEFAULTS(), ...(s||{})}; }catch(e){ return DEFAULTS(); } }\nfunction save(v){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(v)); }catch(e){} }\nlet state = load();\n\nconst clamp01 = x => Math.max(0, Math.min(1, Number.isFinite(x)?x:0));\nconst pct = r => Math.round(r*100);\nconst $ = id => document.getElementById(id);\nconst escH = t => String(t??\"\").replace(/[&<>\"]/g, c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\n\n/* ───────── 카드 (요약 버튼) ───────── */\nfunction buildMetrics(){\n  $(\"metrics\").innerHTML = METRICS.map((m,i)=>`\n    <button type=\"button\" class=\"m\" id=\"m-${m.id}\" data-id=\"${m.id}\" aria-haspopup=\"dialog\">\n      <div class=\"m-top\">\n        <span class=\"idx\">${String(i+1).padStart(2,\"0\")}<\/span>\n        <span class=\"name\">${m.name}<\/span>\n        <span class=\"tag ${m.basis}\">${m.basis===\"market\"?\"시장 기준\":\"개인 설정\"}<\/span>\n      <\/div>\n      <div class=\"m-mid\">\n        <div class=\"pct num\" data-pct>–<\/div>\n        <div class=\"vs\" data-vs><\/div>\n      <\/div>\n      <div class=\"bar\"><i data-bar style=\"width:0%\"><\/i><\/div>\n      <div class=\"m-foot\"><span data-sub><\/span><span class=\"open\">자세히 입력 ›<\/span><\/div>\n    <\/button>`).join(\"\");\n  document.querySelectorAll(\"#metrics .m\").forEach(b=> b.addEventListener(\"click\",()=>openDetail(b.dataset.id)));\n}\n\n/* ───────── 상세 입력 창 ───────── */\nlet openId = null;\nfunction openDetail(id){\n  openId = id; const m = METRICS.find(x=>x.id===id), i = METRICS.indexOf(m);\n  $(\"dlg-idx\").textContent = String(i+1).padStart(2,\"0\");\n  $(\"dlg-name\").textContent = m.name;\n  $(\"dlg-tag\").className = \"tag \"+m.basis; $(\"dlg-tag\").textContent = m.basis===\"market\"?\"시장 기준\":\"개인 설정\";\n  $(\"dlg-basis\").textContent = m.basisText();\n  $(\"dlg-chips\").innerHTML = m.chips ? m.chips().map(c=>`<span class=\"chip\">${c.tag} <b>${c.n}<\/b><\/span>`).join(\"\") : \"\";\n  $(\"dlg-reason\").textContent = m.reason ? \"설정 이유 · \"+m.reason : \"\";\n  $(\"dlg-reason\").hidden = !m.reason;\n  $(\"dlg-hint\").textContent = m.hint;\n  renderEditor(m); refreshDetail();\n  $(\"dlg\").showModal();\n}\nfunction refreshDetail(){\n  if(!openId) return; const m = METRICS.find(x=>x.id===openId), r = m.calc(state);\n  $(\"dlg-pct\").innerHTML = `${pct(r.rate)}<small>%<\/small>`;\n  $(\"dlg-vs\").innerHTML = `내 값 <b>${r.mine}<\/b> / 목표 <b>${r.goal}<\/b>`;\n  $(\"dlg-bar\").style.width = pct(r.rate)+\"%\";\n  $(\"dlg-sub\").textContent = r.sub;\n}\nfunction commit(rerender){ save(state); update(); refreshDetail(); if(rerender) renderEditor(METRICS.find(x=>x.id===openId)); }\n\nfunction inputHTML(f, val, attrs){\n  if(f.t===\"select\") return `<select ${attrs}><option value=\"\">선택<\/option>${f.o.map(o=>`<option${o===val?\" selected\":\"\"}>${o}<\/option>`).join(\"\")}<\/select>`;\n  return `<input ${attrs} type=\"${f.t===\"number\"?\"number\":f.t===\"url\"?\"url\":\"text\"}\" ${f.t===\"number\"?'min=\"0\" step=\"1\" inputmode=\"numeric\"':\"\"} placeholder=\"${f.ph||\"\"}\" value=\"${escH(val)}\">`;\n}\n\nfunction renderEditor(m){\n  const box = $(\"dlg-body\");\n  if(m.kind===\"list\"){\n    const rows = state[m.id], cols = m.fields.map(f=>f.w).join(\" \")+\" 34px\";\n    box.innerHTML = `\n      <div class=\"ed-head\" style=\"grid-template-columns:${cols}\">${m.fields.map(f=>`<span>${f.l}<\/span>`).join(\"\")}<span><\/span><\/div>\n      ${rows.length?\"\":`<div class=\"ed-empty\">아직 항목이 없습니다 · 아래에서 추가<\/div>`}\n      ${rows.map((r,ri)=>`<div class=\"ed-row\" style=\"grid-template-columns:${cols}\">\n        ${m.fields.map(f=>`<label class=\"ed-cell${f.t===\"url\"?\" url\":\"\"}\"><span class=\"ed-l\">${f.l}<\/span>${inputHTML(f, r[f.k]??\"\", `data-r=\"${ri}\" data-k=\"${f.k}\" data-t=\"${f.t}\"`)}<\/label>`).join(\"\")}\n        <button type=\"button\" class=\"ed-del\" data-del=\"${ri}\" aria-label=\"이 항목 삭제\">×<\/button><\/div>`).join(\"\")}\n      <button type=\"button\" class=\"ed-add\" id=\"ed-add\">+ 항목 추가<\/button>`;\n    box.querySelectorAll(\"[data-r]\").forEach(el=> el.addEventListener(\"input\",e=>{\n      const t=e.target, row=state[m.id][+t.dataset.r];\n      row[t.dataset.k] = t.dataset.t===\"number\" ? Math.max(0, Math.floor(Number(t.value)||0)) : t.value;\n      commit(false);\n    }));\n    box.querySelectorAll(\"[data-del]\").forEach(b=> b.addEventListener(\"click\",()=>{ state[m.id].splice(+b.dataset.del,1); commit(true); }));\n    $(\"ed-add\").addEventListener(\"click\",()=>{\n      state[m.id].push(Object.fromEntries(m.fields.map(f=>[f.k, f.t===\"number\"?0:\"\"]))); commit(true);\n      const ins = box.querySelectorAll('.ed-row:last-of-type input'); ins[0] && ins[0].focus();\n    });\n  }\n  if(m.kind===\"tools\"){\n    box.innerHTML = MARKET.topSkills.map(t=>{ const v=Number(state.tools[t.tag])||0; return `\n      <div class=\"lv-row\"><div class=\"lv-name\">${t.tag}<small>공고 ${t.n}건<\/small><\/div>\n        <div class=\"seg\" role=\"radiogroup\" aria-label=\"${t.tag} 숙련도\">${LEVELS.map(([p,l])=>`<button type=\"button\" role=\"radio\" aria-checked=\"${v===p}\" class=\"${v===p?\"on\":\"\"}\" data-tool=\"${escH(t.tag)}\" data-v=\"${p}\"><b>${p}%<\/b>${l}<\/button>`).join(\"\")}<\/div>\n      <\/div>`; }).join(\"\") + `\n      <div class=\"ed-sub\">기타 툴 <small>계산에는 미포함 · 기록용<\/small><\/div>\n      ${state.toolsExtra.map((r,ri)=>`<div class=\"ed-row\" style=\"grid-template-columns:2fr 140px 34px\">\n        <label class=\"ed-cell\"><span class=\"ed-l\">툴 이름<\/span><input data-x=\"${ri}\" data-k=\"name\" placeholder=\"예: TestRail\" value=\"${escH(r.name)}\"><\/label>\n        <label class=\"ed-cell\"><span class=\"ed-l\">숙련도<\/span><select data-x=\"${ri}\" data-k=\"pct\">${LEVELS.map(([p,l])=>`<option value=\"${p}\"${Number(r.pct)===p?\" selected\":\"\"}>${p}% ${l}<\/option>`).join(\"\")}<\/select><\/label>\n        <button type=\"button\" class=\"ed-del\" data-xdel=\"${ri}\" aria-label=\"삭제\">×<\/button><\/div>`).join(\"\")}\n      <button type=\"button\" class=\"ed-add\" id=\"ed-add\">+ 기타 툴 추가<\/button>`;\n    box.querySelectorAll(\"[data-tool]\").forEach(b=> b.addEventListener(\"click\",()=>{ state.tools[b.dataset.tool]=+b.dataset.v; commit(true); }));\n    box.querySelectorAll(\"[data-x]\").forEach(el=> el.addEventListener(\"input\",e=>{ state.toolsExtra[+e.target.dataset.x][e.target.dataset.k]=e.target.value; commit(false); }));\n    box.querySelectorAll(\"[data-xdel]\").forEach(b=> b.addEventListener(\"click\",()=>{ state.toolsExtra.splice(+b.dataset.xdel,1); commit(true); }));\n    $(\"ed-add\").addEventListener(\"click\",()=>{ state.toolsExtra.push({name:\"\",pct:0}); commit(true); });\n  }\n  if(m.kind===\"quals\"){\n    box.innerHTML = MARKET.topConditions.map(c=>{ const q=state.quals[c.tag]||{st:\"no\",note:\"\"}; return `\n      <div class=\"q-row\"><div class=\"lv-name\">${c.tag}<small>공고 ${c.n}건<\/small><\/div>\n        <div class=\"seg seg3\">${QSTAT.map(([k,l])=>`<button type=\"button\" class=\"${q.st===k?\"on \"+k:\"\"}\" data-q=\"${escH(c.tag)}\" data-st=\"${k}\">${l}<\/button>`).join(\"\")}<\/div>\n        <input class=\"q-note\" data-qn=\"${escH(c.tag)}\" placeholder=\"메모 · 예: 자격증명, 취득일, 학과\" value=\"${escH(q.note)}\">\n      <\/div>`; }).join(\"\");\n    const get = t => state.quals[t] || (state.quals[t]={st:\"no\",note:\"\"});\n    box.querySelectorAll(\"[data-q]\").forEach(b=> b.addEventListener(\"click\",()=>{ get(b.dataset.q).st=b.dataset.st; commit(true); }));\n    box.querySelectorAll(\"[data-qn]\").forEach(el=> el.addEventListener(\"input\",e=>{ get(e.target.dataset.qn).note=e.target.value; commit(false); }));\n  }\n}\n\nfunction update(){\n  const results = METRICS.map(m=>({ m, ...m.calc(state) }));\n  results.forEach(({m,rate,mine,goal,sub})=>{\n    const el = $(\"m-\"+m.id);\n    el.querySelector(\"[data-pct]\").innerHTML = `${pct(rate)}<small>%<\/small>`;\n    el.querySelector(\"[data-vs]\").innerHTML = `<b>${mine}<\/b> / ${goal}`;\n    el.querySelector(\"[data-bar]\").style.width = pct(rate)+\"%\";\n    el.querySelector(\"[data-sub]\").textContent = sub;\n  });\n  const avg = results.reduce((a,r)=>a+r.rate,0)/results.length;\n\n  $(\"total-big\").innerHTML = `${pct(avg)}<small>%<\/small>`;\n  $(\"total-bar\").style.width = pct(avg)+\"%\";\n  $(\"total-formula\").textContent = \"6개 지표 단순 평균 · 가중치 없음\";\n  $(\"total-list\").innerHTML = results.map(r=>`<li><span>${r.m.name}<\/span><b class=\"num\">${pct(r.rate)}%<\/b><\/li>`).join(\"\");\n\n  $(\"kpi-total\").innerHTML = `${pct(avg)}<small>%<\/small>`;\n  $(\"kpi-total-sub\").textContent = \"지표 6개 단순 평균\";\n  $(\"kpi-sample\").innerHTML = `${MARKET.sampleSize}<small>건<\/small>`;\n  $(\"kpi-full\").innerHTML = `${results.filter(r=>r.rate>=1).length}<small>/ 6개<\/small>`;\n  const low = results.reduce((a,b)=> b.rate<a.rate?b:a);\n  $(\"kpi-low\").textContent = low.m.name;\n  $(\"kpi-low-sub\").textContent = `충족률 ${pct(low.rate)}%`;\n  $(\"kpi-ai\").innerHTML = `${Math.round(MARKET.aiMentionCount/MARKET.sampleSize*100)}<small>%<\/small>`;\n  $(\"kpi-ai-sub\").textContent = `공고 ${MARKET.sampleSize}건 중 ${MARKET.aiMentionCount}건`;\n  $(\"band-note\").textContent = `표본 ${MARKET.sampleSize}건 · 공고 1건 ≈ ${(100/MARKET.sampleSize).toFixed(1)}%p · 경향으로 읽기`;\n  updateCharts(results);\n}\n\n/* ───────── 그래프 (② ③) ───────── */\nconst C = { blue:\"#2563eb\", blueFill:\"rgba(37,99,235,.18)\", goal:\"#94a3b8\", amber:\"#f59e0b\", grid:\"#eef2f7\", ink:\"#334155\", muted:\"#64748b\" };\nlet radarChart, barChart;\n\nfunction initCharts(){\n  if(typeof Chart===\"undefined\"){\n    [\"radar\",\"bars\",\"market\"].forEach(id=>{ const b=$(id).parentElement; b.style.height=\"auto\"; b.innerHTML='<div class=\"placeholder\">차트 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.<\/div>'; });\n    return false;\n  }\n  Chart.defaults.font.family = '\"Pretendard Variable\",Pretendard,-apple-system,\"Malgun Gothic\",sans-serif';\n  Chart.defaults.color = C.ink;\n\n  // 막대 끝 숫자 표기\n  const endLabels = {\n    id:\"endLabels\",\n    afterDatasetsDraw(chart, _a, opts){\n      const {ctx} = chart; const meta = chart.getDatasetMeta(chart.data.datasets.length-1);\n      ctx.save(); ctx.font = \"700 12px \" + Chart.defaults.font.family; ctx.fillStyle = C.ink; ctx.textBaseline=\"middle\";\n      meta.data.forEach((bar,i)=>{ const t = opts.text(i); if(t) ctx.fillText(t, bar.x + 8, bar.y); });\n      ctx.restore();\n    }\n  };\n\n  radarChart = new Chart($(\"radar\"), {\n    type:\"radar\",\n    data:{ labels: METRICS.map(m=>m.name), datasets:[\n      { label:\"내 충족률\", data:METRICS.map(()=>0), borderColor:C.blue, backgroundColor:C.blueFill, borderWidth:2, pointRadius:4, pointBackgroundColor:C.blue, pointBorderColor:\"#fff\", pointBorderWidth:2, pointHoverRadius:6 },\n      { label:\"목표\", data:METRICS.map(()=>100), borderColor:C.goal, borderDash:[5,4], borderWidth:1.5, backgroundColor:\"transparent\", pointRadius:0, pointHitRadius:0 }\n    ]},\n    options:{ maintainAspectRatio:false, animation:{duration:300},\n      scales:{ r:{ min:0, max:100, ticks:{stepSize:25, callback:v=>v+\"%\", backdropColor:\"transparent\", color:C.muted, font:{size:10}},\n        grid:{color:C.grid}, angleLines:{color:C.grid}, pointLabels:{font:{size:12.5, weight:\"700\"}, color:C.ink} } },\n      plugins:{ legend:{display:false},\n        tooltip:{ filter:i=>i.datasetIndex===0, callbacks:{ label:i=>` 충족률 ${i.raw}%` } } } }\n  });\n\n  barChart = new Chart($(\"bars\"), {\n    type:\"bar\", plugins:[endLabels],\n    data:{ labels: METRICS.map(m=>m.name), datasets:[\n      { label:\"목표\", data:METRICS.map(()=>100), backgroundColor:\"#f1f5f9\", borderRadius:4, borderSkipped:false, barPercentage:.62, categoryPercentage:.9, grouped:false, order:2 },\n      { label:\"충족률\", data:METRICS.map(()=>0), backgroundColor:METRICS.map(m=>m.basis===\"market\"?C.blue:C.goal), borderRadius:4, borderSkipped:false, barPercentage:.62, categoryPercentage:.9, grouped:false, order:1 }\n    ]},\n    options:{ indexAxis:\"y\", maintainAspectRatio:false, animation:{duration:300}, layout:{padding:{right:150}},\n      scales:{ x:{min:0, max:100, ticks:{callback:v=>v+\"%\", color:C.muted, stepSize:25}, grid:{color:C.grid}, border:{display:false}},\n               y:{ grid:{display:false}, border:{display:false}, ticks:{font:{size:12.5, weight:\"700\"}, color:C.ink} } },\n      plugins:{ legend:{display:false},\n        endLabels:{ text:i=>{ const r=barChart && barChart.$results && barChart.$results[i]; if(!r) return \"\"; return `${pct(r.rate)}%  ·  ${r.mine} / ${r.goal}`; } },\n        tooltip:{ filter:i=>i.datasetIndex===1, callbacks:{ label:i=>{ const r=barChart.$results[i.dataIndex]; return ` 충족률 ${pct(r.rate)}% (내 값 ${r.mine} / 목표 ${r.goal})`; } } } } }\n  });\n\n  // ③ 시장 데이터: 3건 이상 등장 항목 (공동 순위 포함)\n  const cut = TALLY.length>=10 ? TALLY[9].total : 0;\n  const top = TALLY.filter(t=>t.total>=cut);\n  const N = MARKET.sampleSize;\n  $(\"market\").parentElement.style.height = (top.length*38 + 60) + \"px\";\n  new Chart($(\"market\"), {\n    type:\"bar\", plugins:[endLabels],\n    data:{ labels: top.map(t=>t.tag), datasets:[\n      { label:\"필수(자격요건)\", data: top.map(t=>t.req), backgroundColor:C.blue, borderColor:\"#fff\", borderWidth:{right:2}, borderRadius:{topLeft:4,bottomLeft:4}, borderSkipped:false, stack:\"s\", barPercentage:.7 },\n      { label:\"우대사항\", data: top.map(t=>t.pref), backgroundColor:C.amber, borderRadius:{topRight:4,bottomRight:4}, borderSkipped:false, stack:\"s\", barPercentage:.7 }\n    ]},\n    options:{ indexAxis:\"y\", maintainAspectRatio:false, animation:false, layout:{padding:{right:90}},\n      scales:{ x:{ stacked:true, min:0, max:N, ticks:{stepSize:3, color:C.muted, callback:v=>v+\"건\"}, grid:{color:C.grid}, border:{display:false} },\n               y:{ stacked:true, grid:{display:false}, border:{display:false}, ticks:{font:{size:12.5, weight:\"600\"}, color:C.ink} } },\n      plugins:{ legend:{display:false},\n        endLabels:{ text:i=>`${top[i].total}건 · ${Math.round(top[i].total/N*100)}%` },\n        tooltip:{ mode:\"index\", callbacks:{\n          title:it=>it[0].label,\n          label:i=> ` ${i.dataset.label} ${i.raw}건`,\n          footer:it=>{ const t=top[it[0].dataIndex]; return `합계 ${t.total}건 / 공고 ${N}건 (${Math.round(t.total/N*100)}%)`; } } } } }\n  });\n  // 위 플러그인은 마지막 데이터셋(우대) 막대 끝에 라벨을 그림 → 우대 0건이면 필수 막대 끝 위치와 같음\n  $(\"market-cap\").textContent = `도표 3. 언급 공고 수 · 10위 동률(${cut}건) 포함 ${top.length}개`;\n  return true;\n}\n\nfunction renderMarketText(){\n  const N = MARKET.sampleSize;\n  $(\"s3-desc\").innerHTML = `<li>게임잡 신입·경력무관 QA 공고 ${N}건<\/li><li>수집일 ${COLLECTED_AT}<\/li><li>공고 1건 ≈ ${(100/N).toFixed(1)}%p · 경향으로 읽기<\/li>`;\n  const mini = (n,tot,label) => `<div class=\"mini\"><div class=\"mini-bar\"><i style=\"width:${Math.round(n/tot*100)}%\"><\/i><\/div><span class=\"num\">${label}<\/span><\/div>`;\n  const chipsOf = arr => `<div class=\"mchips\">${arr.map(x=>`<span class=\"chip\">${x.tag} <b>${x.n}<\/b><\/span>`).join(\"\")}<\/div>`;\n  const eduFree = POSTINGS.filter(p=>p.edu===\"학력무관\").length;\n  $(\"facts\").innerHTML = `\n    <div class=\"fact\"><div class=\"k\"><span class=\"tag market\">시장 기준<\/span>QA 실무 경력<\/div>\n      <div class=\"v num\">${MARKET.careerMedian}<small>개월<\/small><\/div>\n      ${mini(MARKET.careerStatedCount,N,`기간 명시 ${MARKET.careerStatedCount}/${N}건 · 근거 약함`)}<\/div>\n    <div class=\"fact\"><div class=\"k\"><span class=\"tag market\">시장 기준<\/span>툴·스킬<\/div>\n      <div class=\"v num\">${MARKET.topSkills.length}<small>개<\/small><\/div>\n      ${chipsOf(MARKET.topSkills)}<div class=\"d\">Office·Sheets → 스프레드시트로 통합<\/div><\/div>\n    <div class=\"fact\"><div class=\"k\"><span class=\"tag market\">시장 기준<\/span>자격·학력<\/div>\n      <div class=\"v num\">${MARKET.topConditions.length}<small>항목<\/small><\/div>\n      ${chipsOf(MARKET.topConditions)}${mini(eduFree,N,`학력무관 ${eduFree}/${N}건`)}<\/div>\n    <div class=\"fact\"><div class=\"k\"><span class=\"tag market\">시장 참고치<\/span>AI·자동화 언급<\/div>\n      <div class=\"v num\">${MARKET.aiMentionCount}<small>/ ${N}건<\/small><\/div>\n      ${mini(MARKET.aiMentionCount,N,POSTINGS.filter(p=>p.ai).map(p=>p.company).join(\" · \"))}<\/div>`;\n  renderMix();\n}\n\n\nfunction renderMix(){\n  const N=POSTINGS.length;\n  const group=(f)=>{const m={}; POSTINGS.forEach(p=>{const k=f(p); m[k]=(m[k]||0)+1}); return Object.entries(m).sort((a,b)=>b[1]-a[1]);};\n  const rows=[\n    [\"경력 조건\", group(p=>p.career)],\n    [\"고용 형태\", group(p=>p.employ===\"-\"?\"미기재\":p.employ)],\n    [\"학력\", group(p=>p.edu)],\n    [\"AI·자동화 언급\", group(p=>p.ai?\"언급\":\"없음\")],\n  ];\n  const shades=[\"#1e40af\",\"#3b82f6\",\"#93c5fd\",\"#cbd5e1\"];\n  $(\"mix\").innerHTML = rows.map(([name,parts])=>`\n    <div class=\"mix-row\"><div class=\"mix-name\">${name}<\/div>\n      <div class=\"mix-bar\">${parts.map(([k,n],i)=>`<span style=\"flex:${n};background:${shades[Math.min(i,3)]};color:${i<2?\"#fff\":\"#0f172a\"}\" title=\"${k} ${n}건 (${Math.round(n/N*100)}%)\">${n}<\/span>`).join(\"\")}<\/div>\n      <div class=\"mix-leg\">${parts.map(([k,n],i)=>`<span><i style=\"background:${shades[Math.min(i,3)]}\"><\/i>${k} ${Math.round(n/N*100)}%<\/span>`).join(\"\")}<\/div>\n    <\/div>`).join(\"\");\n}\n\nfunction updateCharts(results){\n  if(!radarChart) return;\n  radarChart.data.datasets[0].data = results.map(r=> r.rate==null?0:pct(r.rate));\n  radarChart.update();\n  barChart.$results = results;\n  barChart.data.datasets[1].data = results.map(r=> r.rate==null?0:pct(r.rate));\n  barChart.update();\n}\n\n/* ───────── ④ 공고 원본 표 ───────── */\nconst ROWS = POSTINGS.map((p,i)=>({...p, no:i+1, nreq:p.req.length+p.cond.length, npref:p.pref.length, ai:p.ai?1:0}));\nlet sortKey=\"no\", sortDir=1;\nconst esc = t => String(t).replace(/[&<>\"]/g, c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst chips = (arr,cls) => arr.length ? `<div class=\"chips\">${arr.map(t=>`<span class=\"chip ${cls}\">${esc(t)}<\/span>`).join(\"\")}<\/div>` : `<span class=\"none\">없음<\/span>`;\n\nfunction renderTable(){\n  const q=$(\"f-q\").value.trim().toLowerCase(), fc=$(\"f-career\").value, fe=$(\"f-employ\").value, fa=$(\"f-ai\").value;\n  let rows = ROWS.filter(r=>{\n    if(fc && r.career!==fc) return false;\n    if(fe && r.employ!==fe) return false;\n    if(fa!==\"\" && String(r.ai)!==fa) return false;\n    if(q){ const hay=[r.company,r.title,...r.req,...r.pref,...r.cond].join(\" \").toLowerCase(); if(!hay.includes(q)) return false; }\n    return true;\n  });\n  rows.sort((a,b)=>{ const x=a[sortKey], y=b[sortKey]; return (typeof x===\"number\" ? x-y : String(x).localeCompare(String(y),\"ko\")) * sortDir || a.no-b.no; });\n  $(\"tbl\").querySelector(\"tbody\").innerHTML = rows.map(r=>`\n    <tr>\n      <td class=\"c-no num\">${r.no}<\/td>\n      <td data-l=\"회사 · 공고\"><div class=\"co\">${esc(r.company)}<\/div><div class=\"ti\">${esc(r.title)}<\/div><\/td>\n      <td data-l=\"경력 조건\">${r.career}${r.careerNote?`<div class=\"note\">${esc(r.careerNote)}<\/div>`:\"\"}<\/td>\n      <td data-l=\"고용 형태\">${r.employ===\"-\"?'<span class=\"none\">미기재<\/span>':r.employ}<\/td>\n      <td data-l=\"학력\">${r.edu}<\/td>\n      <td data-l=\"필수 항목\">${chips([...r.req,...r.cond.filter(c=>!r.req.includes(c))], r.req.length?\"\":\"c\")}<\/td>\n      <td data-l=\"우대 항목\">${chips(r.pref,\"p\")}<\/td>\n      <td data-l=\"AI·자동화\">${r.ai?'<span class=\"yes\">언급<\/span>':'<span class=\"none\">없음<\/span>'}<\/td>\n      <td data-l=\"출처 · 수집일\"><a href=\"${r.url}\" target=\"_blank\" rel=\"noopener noreferrer\">게임잡 공고 ↗<\/a><div class=\"date num\">${r.collectedAt}<\/div><\/td>\n    <\/tr>`).join(\"\");\n  $(\"tbl-empty\").hidden = rows.length>0;\n  $(\"f-count\").innerHTML = `<b class=\"num\">${rows.length}<\/b> / ${ROWS.length}건`;\n  document.querySelectorAll(\"#tbl th\").forEach(th=>{\n    const on = th.dataset.k===sortKey; th.classList.toggle(\"sorted\",on);\n    th.querySelector(\".arr\")?.remove();\n    if(on && sortKey!==\"no\") th.insertAdjacentHTML(\"beforeend\",`<span class=\"arr\">${sortDir>0?\"▲\":\"▼\"}<\/span>`);\n  });\n}\nfunction initTable(){\n  [...new Set(ROWS.map(r=>r.employ).filter(e=>e!==\"-\"))].forEach(e=> $(\"f-employ\").insertAdjacentHTML(\"beforeend\",`<option>${e}<\/option>`));\n  [\"f-q\",\"f-career\",\"f-employ\",\"f-ai\"].forEach(id=> $(id).addEventListener(\"input\", renderTable));\n  document.querySelectorAll(\"#tbl th\").forEach(th=> th.addEventListener(\"click\",()=>{\n    const k=th.dataset.k;\n    if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir = [\"nreq\",\"npref\",\"ai\"].includes(k) ? -1 : 1; }\n    renderTable();\n  }));\n  // 푸터 수치\n  const byCo = {}; POSTINGS.forEach(p=> byCo[p.company]=(byCo[p.company]||0)+1);\n  const heavy = Object.entries(byCo).filter(([,n])=>n>=3).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`${c} ${n}건`).join(\", \");\n  const N=POSTINGS.length;\n  $(\"ft-sample1\").textContent = `공고 ${N}건 · ${Object.keys(byCo).length}개 회사`;\n  $(\"ft-limit1\").textContent = `회사 쏠림: ${heavy}`;\n  renderTable();\n}\n\n/* 초기화 */\n$(\"reset\").addEventListener(\"click\", ()=>{\n  if(!confirm(\"입력 undingClientRect().top+scrollY-offset();\n setOn(id);clearTimeout(lock);lock=setTimeout(()=>lock=null,2000);\n scrollTo({top:Math.max(0,y),behavior:smooth?'smooth':'auto'})};\ndocument.querySelectorAll('a[href^=\"#\"]').forEach(a=>a.addEventListener('click',e=>{\n const id=a.getAttribute('href').slice(1);e.preventDefault();\n if(id==='top'){scrollTo({top:0,behavior:'smooth'});setOn('');return}goTo(id)}));\nconst spy=()=>{if(lock)return;\n if(innerHeight+scrollY>=document.documentElement.scrollHeight-4){setOn(secs[secs.length-1][0]);return}\n let cur='';for(const [id] of secs){if($(id).getBoundingClientRect().top-offset()<=8)cur=id}setOn(cur)};\naddEventListener('scroll',()=>requestAnimationFrame(spy),{passive:true});\naddEventListener('scrollend',()=>{if(lock){clearTimeout(lock);lock=null}});spy();\n\n/* style switch */\ndocument.querySelectorAll('.sty button').forEach(b=>b.onclick=()=>{document.body.dataset.s=b.dataset.s;document.querySelectorAll('.sty button').forEach(x=>x.classList.toggle('on',x==b))});\n/* inner tabs */\ndocument.querySelectorAll('.itab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.itab').forEach(x=>x.classList.toggle('on',x==b));document.querySelectorAll('.pane').forEach((p,i)=>p.classList.toggle('on',i==b.dataset.p))});\n/* reveal + gauges */\nconst ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');e.target.querySelectorAll('.g-fill').forEach(g=>g.style.width=g.dataset.w+'%');ro.unobserve(e.target)}}),{threshold:.12});\ndocument.querySelectorAll('.reveal').forEach(el=>ro.observe(el));\n<\/script>\n<\/body>\n<\/html>\n"

const loaded = {};
function external(frame){
  try{
    const d = frame.contentDocument;
    d.querySelectorAll('a[href^="http"]').forEach(a=>{ a.target="_blank"; a.rel="noopener noreferrer"; });
  }catch(e){}
}
function show(v, push){
  if(!PAGES[v]) v = "quant";
  const f = document.getElementById("v-"+v);
  if(!loaded[v]){ f.addEventListener("load", ()=>external(f), {once:true}); f.srcdoc = PAGES[v]; loaded[v]=true; }
  document.querySelectorAll(".views iframe").forEach(x=>x.classList.toggle("on", x===f));
  document.querySelectorAll(".tabs button").forEach(b=>{ const on=b.dataset.v===v; b.setAttribute("aria-selected",on); b.tabIndex=on?0:-1; });
  document.title = v==="quant" ? "취업 준비를 위한 정량 사이트" : "아수라 | LoL 아수라장 전용 장식 번들 기획";
  if(push){ try{ history.replaceState(null,"","#"+v); }catch(e){ /* 미리보기(about:srcdoc) 등에서는 주소 변경 생략 */ } }
}
document.querySelectorAll(".tabs button").forEach(b=> b.addEventListener("click",()=>show(b.dataset.v,true)));
document.querySelector(".tabs").addEventListener("keydown",e=>{
  if(e.key!=="ArrowRight" && e.key!=="ArrowLeft") return;
  const bs=[...document.querySelectorAll(".tabs button")], i=bs.findIndex(b=>b.getAttribute("aria-selected")==="true");
  const n=bs[(i+(e.key==="ArrowRight"?1:-1)+bs.length)%bs.length]; n.focus(); show(n.dataset.v,true);
});
let start=""; try{ start=location.hash.slice(1); }catch(e){}
show(start, false);
